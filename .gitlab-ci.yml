stages:
  - lint
  - test
  - security

shellcheck:
  stage: lint
  image: koalaman/shellcheck-alpine:latest
  script:
    - find . -name "*.sh" -exec shellcheck -x {} +
  allow_failure: true

syntax_check:
  stage: test
  image: bash:latest
  script:
    - echo "Running syntax checks..."
    - bash tests/test_syntax.sh
  only:
    - main
    - merge_requests

secret_detection:
  stage: security
  image: alpine:latest
  script:
    - echo "Searching for potential hardcoded secrets..."
    - grep -rE "password|apikey|token|secret" . --exclude-dir=.git || true
